{% extends "base.html" %}
{% block content %}
  <h2>Upload Students CSV</h2>
  <form method="post" enctype="multipart/form-data">
    <p><input type="file" name="file" accept=".csv" required></p>
    <p><button type="submit">Upload and Replace CSV</button></p>
  </form>
  <p>CSV must contain header: student_id,name,attendance_percent,avg_assignment_score,study_hours_per_week,behavior_incidents,previous_grade,label</p>
{% endblock %}
